<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>WebAPTV Split Direct URL Test</title><style>*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#000}#app{display:flex}.pane{height:100%;min-width:0;overflow:hidden}.left{width:50%;flex:none}.right{flex:1}.pane object{display:block;width:100%;height:100%;border:0;background:#000}.divider{width:34px;min-width:34px;margin:0 -17px;z-index:99;display:flex;align-items:center;justify-content:center;cursor:ew-resize;touch-action:none}.divider:before{content:"↔";display:flex;align-items:center;justify-content:center;width:36px;height:64px;border-radius:18px;background:#111d;color:#fff;border:2px solid #fff;font:20px sans-serif}</style></head><body><div id="app"><section id="left" class="pane left"><object data="https://www.youtube.com/" type="text/html"></object></section><div id="divider" class="divider"></div><section class="pane right"><object data="https://www.google.com/maps/" type="text/html"></object></section></div><script>const app=document.getElementById('app'),left=document.getElementById('left'),d=document.getElementById('divider');let drag=false;function set(x){const r=app.getBoundingClientRect();let p=(x-r.left)/r.width*100;p=Math.max(12,Math.min(88,p));left.style.width=p+'%'}d.onpointerdown=e=>{drag=true;e.preventDefault();d.setPointerCapture?.(e.pointerId)};d.onpointermove=e=>{if(drag){e.preventDefault();set(e.clientX)}};d.onpointerup=d.onpointercancel=()=>drag=false;d.addEventListener('touchstart',e=>{drag=true;e.preventDefault()},{passive:false});d.addEventListener('touchmove',e=>{if(drag){e.preventDefault();set(e.touches[0].clientX)}},{passive:false});d.addEventListener('touchend',()=>drag=false)</script></body></html>

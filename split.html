<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>WebAPTV Split</title><style>*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#080808;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#app{display:flex}.pane{height:100%;min-width:0;overflow:auto;background:#0f0f0f}.left{width:50%;flex:none}.right{flex:1;background:#e8eef5;color:#111}.divider{width:34px;min-width:34px;margin:0 -17px;z-index:99;display:flex;align-items:center;justify-content:center;cursor:ew-resize;touch-action:none}.divider:before{content:"↔";display:flex;align-items:center;justify-content:center;width:36px;height:64px;border-radius:18px;background:#111d;color:#fff;border:2px solid #fff;font:20px sans-serif}.webapp{min-height:100%;padding:12px}.webapp header{display:flex;align-items:center;gap:12px;position:sticky;top:0;padding:10px;background:inherit}.logo{font-weight:800;white-space:nowrap}.webapp form{display:flex;flex:1;gap:6px;min-width:0}.webapp input{flex:1;min-width:0;padding:11px;border-radius:22px;border:1px solid #777}.webapp button,.open{border:0;border-radius:20px;padding:11px 16px;text-decoration:none;background:#1677ff;color:#fff;font-weight:700}.youtube-app button{background:#f00}.webapp main{padding:30px 12px}.error{padding:20px}</style></head><body><div id="app"><section id="left" class="pane left"></section><div id="divider" class="divider"></div><section id="right" class="pane right"></section></div><script>const app=document.getElementById('app'),left=document.getElementById('left'),right=document.getElementById('right'),d=document.getElementById('divider');Promise.all([fetch('./youtube.html').then(r=>r.text()),fetch('./maps.html').then(r=>r.text())]).then(([a,b])=>{left.innerHTML=a;right.innerHTML=b;bind()}).catch(e=>{left.innerHTML=right.innerHTML='<div class="error">Không tải được HTML con</div>'});function bind(){document.querySelector('[data-action="youtube"]')?.addEventListener('submit',e=>{e.preventDefault();const q=new FormData(e.currentTarget).get('q');location.href='https://www.youtube.com/results?search_query='+encodeURIComponent(q)});document.querySelector('[data-action="maps"]')?.addEventListener('submit',e=>{e.preventDefault();const q=new FormData(e.currentTarget).get('q');location.href='https://www.google.com/maps/search/'+encodeURIComponent(q)})}let drag=false;function set(x){const r=app.getBoundingClientRect();let p=(x-r.left)/r.width*100;p=Math.max(12,Math.min(88,p));left.style.width=p+'%'}d.onpointerdown=e=>{drag=true;e.preventDefault();d.setPointerCapture?.(e.pointerId)};d.onpointermove=e=>{if(drag){e.preventDefault();set(e.clientX)}};d.onpointerup=d.onpointercancel=()=>drag=false;d.addEventListener('touchstart',e=>{drag=true;e.preventDefault()},{passive:false});d.addEventListener('touchmove',e=>{if(drag){set(e.touches[0].clientX);e.preventDefault()}},{passive:false});d.addEventListener('touchend',()=>drag=false)</script></body></html>

<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>APTV Browser Native Probe</title><style>*{box-sizing:border-box}html,body{margin:0;background:#080808;color:#fff;font-family:-apple-system,sans-serif}main{padding:16px}button,a{display:block;width:100%;margin:9px 0;padding:15px;border:0;border-radius:12px;background:#246fe5;color:#fff;font-size:16px;text-align:center;text-decoration:none}.yt{background:#d22}.test{background:#6c4bd1}pre{white-space:pre-wrap;word-break:break-all;background:#151515;padding:12px;border-radius:10px;min-height:180px}</style></head><body><main><h2>APTV Browser → Native Video</h2><p>Không test IPTV. Test bridge video của Browser APTV.</p>
<a class="yt" href="https://www.youtube.com/watch?v=jNQXAC9IVRw">1. Mở video YouTube thật trong Browser</a>
<button class="test" onclick="scan()">2. Quét bridge + video hiện tại</button>
<button class="test" onclick="send('ready')">3A. aptvBrowser: ready</button>
<button class="test" onclick="send('videoCount')">3B. aptvBrowser: videoCount</button>
<button class="test" onclick="send('youtubePlayback')">3C. aptvBrowser: youtubePlayback</button>
<button onclick="copyLog()">Sao chép kết quả</button><pre id="log">Chưa chạy.</pre></main><script>
const log=document.getElementById('log');let out=[];
function add(x){out.push(typeof x==='string'?x:JSON.stringify(x));log.textContent=out.join('\n\n')}
function handlers(){try{return Object.getOwnPropertyNames(window.webkit?.messageHandlers||{})}catch(e){return ['ERR '+e]}}
function scan(){const vs=[...document.querySelectorAll('video')].map((v,i)=>({i,src:v.currentSrc||v.src||'',paused:v.paused,duration:v.duration,readyState:v.readyState}));add({href:location.href,webkit:!!window.webkit,handlers:handlers(),videos:vs})}
function send(type){try{const h=window.webkit?.messageHandlers?.aptvBrowser;if(!h)return add({type,error:'aptvBrowser unavailable'});h.postMessage({type});add({type,sent:true})}catch(e){add({type,error:String(e)})}}
async function copyLog(){try{await navigator.clipboard.writeText(log.textContent);alert('Đã sao chép')}catch(e){let t=document.createElement('textarea');t.value=log.textContent;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();alert('Đã sao chép')}}
</script></body></html>

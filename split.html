<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>WebAPTV Split Direct Test</title><style>*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#000}#app{display:flex;position:fixed;inset:0}.pane{height:100%;min-width:0}.left{width:50%;flex:none}.right{flex:1}.bar{width:14px;flex:none;background:#222;cursor:col-resize;touch-action:none;position:relative;z-index:9}.bar:after{content:"";position:absolute;left:5px;top:42%;width:4px;height:16%;border-radius:4px;background:#888}iframe{width:100%;height:100%;border:0;background:#111}</style></head><body><div id="app"><div class="pane left" id="left"><iframe src="https://www.youtube.com/" allow="autoplay; fullscreen; encrypted-media; picture-in-picture"></iframe></div><div class="bar" id="bar"></div><div class="pane right"><iframe src="https://www.google.com/maps/" allow="geolocation"></iframe></div></div><script>const app=document.getElementById('app'),left=document.getElementById('left'),bar=document.getElementById('bar');function setSplit(p){p=Math.max(12,Math.min(88,p));left.style.width=p+'%'}function dragAt(x){const r=app.getBoundingClientRect();setSplit((x-r.left)/r.width*100)}bar.addEventListener('pointerdown',e=>{bar.setPointerCapture(e.pointerId);dragAt(e.clientX)});bar.addEventListener('pointermove',e=>{if(bar.hasPointerCapture(e.pointerId))dragAt(e.clientX)});bar.addEventListener('touchmove',e=>{e.preventDefault();dragAt(e.touches[0].clientX)},{passive:false});</script></body></html>

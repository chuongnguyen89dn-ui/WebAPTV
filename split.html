<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>VELORA Split</title><link rel="stylesheet" href="app__a02de66b.css"><link rel="stylesheet" href="instruments-3d__a6a921a1.css"><link rel="stylesheet" href="gps-alignment__e3ca56ba.css"><link rel="stylesheet" href="google-map-workspace__7e439932.css"><style>html,body{margin:0;background:#07111b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100%;overflow:hidden}.shell{height:100%;display:grid;grid-template-rows:54px 1fr 50px;gap:7px;padding:7px;box-sizing:border-box}.tabs,.dock{display:flex;gap:7px;align-items:center;background:#071a2b;border:1px solid #477d9b;border-radius:12px;padding:5px}.tabs b{margin-right:auto;padding-left:12px;font-size:20px}.tabs button,.dock button,.tools button,.groups button,.channels button{background:#102b40;color:#fff;border:1px solid #477d9b;border-radius:10px;padding:9px 13px}.tabs button.active{border-color:#6edcff;box-shadow:0 0 14px #43cfff55}.main{min-height:0;display:grid;grid-template-columns:58% 42%;gap:7px}.media,.side{min-height:0;background:#071a2b;border:1px solid #477d9b;border-radius:13px;overflow:hidden}.media{display:flex;flex-direction:column;padding:9px}.head{display:flex;justify-content:space-between;align-items:center}.search{display:flex;gap:7px;margin:8px 0}.search input{flex:1;background:#081a2a;color:#fff;border:1px solid #477d9b;border-radius:9px;padding:10px}.stage{flex:1;min-height:0;background:#02070b;border-radius:11px;overflow:auto;display:grid;place-items:center}.stage iframe,.stage video{width:100%;height:100%;border:0;background:#000}.empty{text-align:center;color:#9fb5c5}.side{padding:8px;display:grid;grid-template-rows:1fr 1fr auto;gap:8px}.card{border:1px solid #477d9b;border-radius:12px;display:grid;place-content:center;text-align:center;background:radial-gradient(circle,#123b54,#071725 70%)}.clock{font-size:54px;font-weight:300}.speed{font-size:62px;font-weight:300}.tools{display:flex;gap:7px}.tools button{flex:1}.groups,.channels{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:7px;width:100%;padding:7px;box-sizing:border-box}.channels button{text-align:left}.movie iframe,.map iframe{width:100%;height:100%;border:0}.apps{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:15px;width:100%;box-sizing:border-box}.apps button{min-height:80px;background:#102b40;color:#fff;border:1px solid #477d9b;border-radius:14px}.dock span{margin-right:auto;color:#86a8ba;font-size:11px}@media(max-height:500px){.shell{grid-template-rows:44px 1fr 42px}.clock{font-size:34px}.speed{font-size:40px}}</style></head><body><div class="shell"><nav class="tabs"><b>VELORA</b><button data-mode="youtube" class="active">YouTube</button><button data-mode="tv">TV</button><button data-mode="movie">Phim & Series</button><button data-mode="apps">Apps</button></nav><main class="main"><section class="media"><div class="head"><strong id="title">YouTube</strong><button id="full">Toàn màn hình</button></div><form class="search" id="search"><input id="query" placeholder="Tìm YouTube hoặc dán liên kết…"><button>Tìm</button></form><div class="stage" id="stage"><div class="empty"><h2>Hôm nay nghe gì?</h2><p>Tìm hoặc dán link YouTube.</p></div></div></section><aside class="side"><div class="card"><div><div class="clock" id="clock">--:--</div><small>Đồng hồ</small></div></div><div class="card"><div><div class="speed"><span id="speed">0</span></div><small>km/h · GPS</small><div id="gpsStatus"></div></div></div><div class="tools"><button id="gps">GPS</button><button id="map">Bản đồ</button></div></aside></main><footer class="dock"><b>VELORA</b><span>DRIVE MODE</span><button id="home">Trang chủ</button><button id="fit">Fit 100%</button></footer></div><script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script><script>(()=>{'use strict';const $=s=>document.querySelector(s),stage=$('#stage'),title=$('#title'),form=$('#search'),input=$('#query');let mode='youtube',watch=null,hls=null;const ytId=v=>{v=v.trim();if(/^[\w-]{11}$/.test(v))return v;try{const u=new URL(v);if(u.hostname.includes('youtu.be'))return u.pathname.slice(1).split('/')[0];return u.searchParams.get('v')||u.pathname.match(/\/shorts\/([\w-]{11})/)?.[1]||''}catch{return''}};function clean(){if(hls){hls.destroy();hls=null}stage.replaceChildren()}function empty(t){clean();stage.innerHTML='<div class="empty"><h2>'+t+'</h2></div>'}function youtube(q){const id=ytId(q);clean();if(id){const f=document.createElement('iframe');f.allow='autoplay; encrypted-media; fullscreen';f.allowFullscreen=true;f.src='https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1&playsinline=1';stage.append(f);return}stage.innerHTML='<div class="empty"><h2>Tìm kiếm YouTube</h2><p>Mở kết quả tìm kiếm YouTube cho “'+q.replace(/[<>]/g,'')+'”.</p><a style="color:#6edcff" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query='+encodeURIComponent(q)+'">Mở kết quả</a></div>'}async function tv(){clean();stage.innerHTML='<div class="empty">Đang tải danh sách TV…</div>';let data=null;for(const u of ['tv.json','channels.json','api/tv.php'])try{const r=await fetch(u,{cache:'no-store'});if(r.ok){data=await r.json();break}}catch{}const list=Array.isArray(data)?data:(data?.channels||[]);if(!list.length){stage.innerHTML='<div class="empty"><h2>TV</h2><p>Chưa có feed kênh TV trong bản mirror.</p></div>';return}const wrap=document.createElement('div'),groups=document.createElement('div'),channels=document.createElement('div');groups.className='groups';channels.className='channels';wrap.style='width:100%;height:100%;overflow:auto';wrap.append(groups,channels);stage.replaceChildren(wrap);const render=g=>{channels.replaceChildren();list.filter(c=>!g||(c.group_name||c.group||'TV')===g).forEach(c=>{const b=document.createElement('button');b.textContent=c.name||'Kênh';b.onclick=()=>playTV(c);channels.append(b)})};[...new Set(list.map(c=>c.group_name||c.group||'TV'))].forEach(g=>{const b=document.createElement('button');b.textContent=g;b.onclick=()=>render(g);groups.append(b)});render()}function playTV(c){clean();const v=document.createElement('video');v.controls=true;v.autoplay=true;v.playsInline=true;stage.append(v);const u=c.url||c.stream||c.src;if(v.canPlayType('application/vnd.apple.mpegurl'))v.src=u;else if(window.Hls&&Hls.isSupported()){hls=new Hls();hls.loadSource(u);hls.attachMedia(v)}else v.src=u;v.play().catch(()=>{})}function movie(){clean();stage.classList.add('movie');const f=document.createElement('iframe');f.allow='autoplay; fullscreen';f.allowFullscreen=true;f.src='https://tecede.vercel.app/';stage.append(f)}function apps(){clean();const w=document.createElement('div');w.className='apps';[['YouTube','youtube'],['TV','tv'],['Phim & Series','movie'],['Bản đồ','map']].forEach(([n,m])=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>m==='map'?showMap():setMode(m);w.append(b)});stage.append(w)}function showMap(){clean();stage.classList.add('map');const f=document.createElement('iframe');f.allow='geolocation';f.src='google-map.html';stage.append(f)}function setMode(m){mode=m;stage.className='stage';document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));title.textContent=m==='youtube'?'YouTube':m==='tv'?'Truyền hình':m==='movie'?'Phim & Series':'Apps';form.style.display=m==='youtube'?'flex':'none';({youtube:()=>empty('Tìm hoặc dán link YouTube.'),tv,movie,apps}[m])()}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));form.onsubmit=e=>{e.preventDefault();youtube(input.value)};$('#map').onclick=showMap;$('#home').onclick=()=>location.href='index.html';$('#fit').onclick=()=>{document.body.style.zoom='1'};$('#full').onclick=()=>{const p=$('.media');if(document.fullscreenElement)document.exitFullscreen?.();else p.requestFullscreen?.()};function tick(){const d=new Date();$('#clock').textContent=d.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})}tick();setInterval(tick,1000);function gps(){if(!navigator.geolocation){$('#gpsStatus').textContent='Không hỗ trợ GPS';return}$('#gpsStatus').textContent='Đang lấy GPS…';watch=navigator.geolocation.watchPosition(p=>{$('#speed').textContent=Math.max(0,Math.round((p.coords.speed||0)*3.6));$('#gpsStatus').textContent=p.coords.accuracy?'±'+Math.round(p.coords.accuracy)+' m':''},e=>{$('#gpsStatus').textContent=e.message},{enableHighAccuracy:true,maximumAge:1000,timeout:12000})}$('#gps').onclick=gps;gps();const q=new URLSearchParams(location.search);if(q.get('mode')==='tv')setMode('tv');else if(q.get('mode')==='movie')setMode('movie');else if(q.get('settings')==='1')setMode('apps');if(q.get('map')==='1')showMap()})();</script></body></html>

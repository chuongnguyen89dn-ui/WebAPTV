<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>APTV Port Probe</title><style>*{box-sizing:border-box}html,body{margin:0;background:#080808;color:#fff;font-family:-apple-system,sans-serif}main{padding:16px}button{width:100%;margin:6px 0;padding:13px;border:0;border-radius:11px;background:#246fe5;color:#fff;font-size:15px}#copy{background:#16883d}pre{white-space:pre-wrap;word-break:break-all;background:#151515;padding:12px;border-radius:10px;min-height:330px}</style></head><body><main><h2>APTV Port probe</h2><button id="run">Kiểm tra Port thật / Port rỗng</button><button id="copy">Sao chép kết quả</button><pre id="log">Bấm “Kiểm tra Port thật / Port rỗng”, chờ khoảng 4 giây.</pre></main><script>const L=document.getElementById('log'),rt=browser.runtime;let lines=[];const add=x=>{lines.push(x);L.textContent=lines.join('\n\n')};const val=(x)=>{try{return JSON.stringify(x)}catch(e){return String(x)}};run.onclick=()=>{lines=[];const ids=['probe','','aptv','com.aptv'];for(const id of ids){try{const p=rt.connect(id,{name:'aptv-probe'});add('ID '+JSON.stringify(id)+' CREATED tag='+Object.prototype.toString.call(p)+' name='+val(p.name)+' sender='+val(p.sender)+' error='+val(p.error));try{p.onMessage.addListener(m=>add('ID '+JSON.stringify(id)+' MESSAGE '+val(m)))}catch(e){add('ID '+JSON.stringify(id)+' onMessage listener ERROR '+e)}try{p.onDisconnect.addListener(()=>add('ID '+JSON.stringify(id)+' DISCONNECT error='+val(p.error)+' sender='+val(p.sender)))}catch(e){add('ID '+JSON.stringify(id)+' onDisconnect listener ERROR '+e)}try{p.postMessage({type:'aptv-probe',url:'https://www.youtube.com/',time:Date.now()});add('ID '+JSON.stringify(id)+' postMessage OK')}catch(e){add('ID '+JSON.stringify(id)+' postMessage ERROR '+e)}setTimeout(()=>add('ID '+JSON.stringify(id)+' AFTER 3s error='+val(p.error)+' sender='+val(p.sender)),3000)}catch(e){add('ID '+JSON.stringify(id)+' CONNECT ERROR '+e)}}};copy.onclick=async()=>{const t=L.textContent;try{await navigator.clipboard.writeText(t);copy.textContent='Đã sao chép ✓'}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();copy.textContent='Đã sao chép ✓'}setTimeout(()=>copy.textContent='Sao chép kết quả',1500)};</script></body></html>

<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>APTV browser global probe</title><style>*{box-sizing:border-box}html,body{margin:0;background:#080808;color:#fff;font-family:-apple-system,sans-serif}main{padding:18px}button{width:100%;padding:14px;border:0;border-radius:12px;background:#246fe5;color:#fff;font-size:17px}pre{white-space:pre-wrap;word-break:break-all;background:#151515;padding:12px;border-radius:10px;min-height:280px}</style></head><body><main><h2>window.browser probe</h2><button id="scan">Quét window.browser</button><pre id="log">Bấm Quét window.browser rồi gửi lại toàn bộ kết quả.</pre></main><script>const L=document.getElementById('log');function safe(fn){try{return fn()}catch(e){return '[ERR] '+e}}document.getElementById('scan').onclick=()=>{const b=window.browser;let proto=safe(()=>Object.getPrototypeOf(b));let r={exists:typeof b!=='undefined',type:typeof b,string:safe(()=>String(b)),tag:safe(()=>Object.prototype.toString.call(b)),sameAsWindow:b===window,ownKeys:safe(()=>Reflect.ownKeys(b).map(String)),ownNames:safe(()=>Object.getOwnPropertyNames(b)),protoTag:safe(()=>Object.prototype.toString.call(proto)),protoNames:safe(()=>Object.getOwnPropertyNames(proto)),descriptors:{}};for(const k of (Array.isArray(r.ownNames)?r.ownNames:[]).slice(0,100)){r.descriptors[k]=safe(()=>{const d=Object.getOwnPropertyDescriptor(b,k);return {type:typeof b[k],value:(typeof b[k]==='string'||typeof b[k]==='number'||typeof b[k]==='boolean')?b[k]:undefined,get:!!d?.get,set:!!d?.set,writable:d?.writable}})}L.textContent=JSON.stringify(r,null,2)};</script></body></html>

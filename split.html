<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>APTV Browser Probe</title><style>*{box-sizing:border-box}html,body{margin:0;background:#080808;color:#fff;font-family:-apple-system,sans-serif}main{padding:18px}button,a{display:block;width:100%;margin:10px 0;padding:15px;border:0;border-radius:12px;background:#1d72f3;color:#fff;font-size:17px;text-align:center;text-decoration:none}.yt{background:#e11}.map{background:#16883d}pre{white-space:pre-wrap;background:#151515;padding:12px;border-radius:10px}</style></head><body><main><h2>APTV WebView popup test</h2><button class="yt" id="yt">window.open YouTube</button><button class="map" id="map">window.open Google Maps</button><a href="https://www.youtube.com/" target="_blank">target=_blank YouTube</a><a href="https://www.google.com/maps/" target="_blank">target=_blank Maps</a><pre id="log">Bấm từng nút và quan sát APTV mở URL ở đâu.</pre></main><script>const log=document.getElementById('log');function test(url,name){let w=null;try{w=window.open(url,'_blank','popup=yes,width=600,height=600');log.textContent=name+': window.open trả về '+(w?'window object':'null/block');}catch(e){log.textContent=name+': '+e;}}document.getElementById('yt').onclick=()=>test('https://www.youtube.com/','YouTube');document.getElementById('map').onclick=()=>test('https://www.google.com/maps/','Maps');</script></body></html>

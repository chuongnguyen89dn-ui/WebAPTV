<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>WebAPTV Hybrid Split</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#000;color:#fff;font-family:-apple-system,sans-serif}#app{height:100%;display:flex}.left{width:42%;flex:none;background:#090909;display:flex;flex-direction:column;padding:14px}.right{flex:1;min-width:0}.bar{width:12px;background:#333;touch-action:none}.left a{display:block;padding:16px;margin:8px 0;border-radius:12px;background:#d22;color:#fff;text-decoration:none;text-align:center;font-size:16px}.left p{opacity:.8}.right iframe{width:100%;height:100%;border:0;background:#fff}</style></head><body><div id="app"><section class="left" id="left"><h3>YouTube → APTV media</h3><p>Không iframe YouTube. Nút dưới đưa media M3U8 vào native APTV.</p><a href="aptv://play?name=YouTube-M3U-Test&url=https%3A%2F%2Ftest-streams.mux.dev%2Fx36xhzz%2Fx36xhzz.m3u8">Phát nguồn M3U8 qua APTV</a><p>Nếu đường này giữ được Maps khi player mở, ta thay nguồn test bằng nguồn video YouTube đã resolve.</p></section><div class="bar" id="bar"></div><section class="right"><iframe src="https://www.google.com/maps/" allow="geolocation"></iframe></section></div><script>const app=document.getElementById('app'),left=document.getElementById('left'),bar=document.getElementById('bar');function move(x){let r=app.getBoundingClientRect(),p=Math.max(18,Math.min(75,(x-r.left)/r.width*100));left.style.width=p+'%'}bar.onpointerdown=e=>{bar.setPointerCapture(e.pointerId);move(e.clientX)};bar.onpointermove=e=>{if(bar.hasPointerCapture(e.pointerId))move(e.clientX)}</script></body></html>

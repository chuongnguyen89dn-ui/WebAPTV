<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>WebAPTV Hybrid Probe</title><style>*{box-sizing:border-box}html,body{margin:0;background:#080808;color:#fff;font-family:-apple-system,sans-serif}main{padding:16px}button,a{display:block;width:100%;margin:9px 0;padding:15px;border:0;border-radius:12px;background:#246fe5;color:#fff;font-size:16px;text-align:center;text-decoration:none}.yt{background:#d22}.maps{background:#16883d}.test{background:#6c4bd1}pre{white-space:pre-wrap;word-break:break-all;background:#151515;padding:12px;border-radius:10px;min-height:110px}</style></head><body><main><h2>WebAPTV · 3 hướng hybrid</h2><p>Test từng nút. Mục tiêu: dùng đường native của APTV thay vì iframe.</p>
<a class="yt" href="aptv://play?name=YouTube&url=https%3A%2F%2Fwww.youtube.com%2F">1A. YouTube → aptv://play (URL web)</a>
<a class="yt" href="aptv://play?name=YouTubeTest&url=https%3A%2F%2Ftest-streams.mux.dev%2Fx36xhzz%2Fx36xhzz.m3u8">1B. CONTROL → aptv://play (M3U8 thật)</a>
<a class="maps" href="https://www.google.com/maps/">2A. Maps top-level (control)</a>
<a class="yt" href="https://www.youtube.com/">2B. YouTube top-level (control)</a>
<button class="test" onclick="probe()">3. Quét bridge native APTV</button>
<button onclick="copyLog()">Sao chép kết quả</button>
<pre id="log">Chưa chạy.</pre></main><script>
const log=document.getElementById('log');
function probe(){let o={href:location.href,ua:navigator.userAgent,webkit:!!window.webkit,handlers:[]};try{let h=window.webkit&&window.webkit.messageHandlers;if(h)o.handlers=Object.getOwnPropertyNames(h)}catch(e){o.error=String(e)};for(const n of ['aptvBrowser','aptvBrowserMediaNavigation','aptvBrowserBackgroundPlayback']){try{o[n]=!!(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers[n])}catch(e){o[n]=false}}log.textContent=JSON.stringify(o,null,2)}
async function copyLog(){try{await navigator.clipboard.writeText(log.textContent);alert('Đã sao chép')}catch(e){let t=document.createElement('textarea');t.value=log.textContent;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();alert('Đã sao chép')}}
</script></body></html>

<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>APTV runtime probe</title><style>*{box-sizing:border-box}html,body{margin:0;background:#080808;color:#fff;font-family:-apple-system,sans-serif}main{padding:18px}button{width:100%;margin:6px 0;padding:14px;border:0;border-radius:12px;background:#246fe5;color:#fff;font-size:16px}pre{white-space:pre-wrap;word-break:break-all;background:#151515;padding:12px;border-radius:10px;min-height:300px}</style></head><body><main><h2>browser.runtime probe</h2><button id="scan">1. Quét browser.runtime</button><button id="msg">2. Thử runtime.sendMessage</button><button id="conn">3. Thử runtime.connect</button><pre id="log">Bấm 1 trước rồi gửi toàn bộ kết quả.</pre></main><script>const L=document.getElementById('log');const safe=f=>{try{return f()}catch(e){return '[ERR] '+e}};function inspect(o){let p=safe(()=>Object.getPrototypeOf(o));let names=safe(()=>Object.getOwnPropertyNames(o));let r={type:typeof o,string:safe(()=>String(o)),tag:safe(()=>Object.prototype.toString.call(o)),ownKeys:safe(()=>Reflect.ownKeys(o).map(String)),ownNames:names,protoTag:safe(()=>Object.prototype.toString.call(p)),protoNames:safe(()=>Object.getOwnPropertyNames(p)),known:{id:safe(()=>o.id),sendMessage:typeof o?.sendMessage,connect:typeof o?.connect,getURL:typeof o?.getURL,getManifest:typeof o?.getManifest,onMessage:typeof o?.onMessage,onConnect:typeof o?.onConnect,lastError:safe(()=>String(o.lastError))},descriptors:{}};if(Array.isArray(names))for(const k of names.slice(0,100))r.descriptors[k]=safe(()=>{const d=Object.getOwnPropertyDescriptor(o,k);return {type:typeof o[k],value:['string','number','boolean'].includes(typeof o[k])?o[k]:undefined,get:!!d?.get,set:!!d?.set,writable:d?.writable}});return r}document.getElementById('scan').onclick=()=>L.textContent=JSON.stringify(inspect(window.browser&&browser.runtime),null,2);document.getElementById('msg').onclick=async()=>{try{if(typeof browser?.runtime?.sendMessage!=='function')return L.textContent='sendMessage không tồn tại';let x=await Promise.race([browser.runtime.sendMessage({type:'aptv-probe',url:'https://www.youtube.com/'}),new Promise(r=>setTimeout(()=>r('[timeout 3s]'),3000))]);L.textContent='sendMessage result: '+safe(()=>JSON.stringify(x))}catch(e){L.textContent='sendMessage error: '+e}};document.getElementById('conn').onclick=()=>{try{if(typeof browser?.runtime?.connect!=='function')return L.textContent='connect không tồn tại';let p=browser.runtime.connect({name:'aptv-probe'});L.textContent='connect result: '+JSON.stringify(inspect(p),null,2)}catch(e){L.textContent='connect error: '+e}}</script></body></html>

<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>APTV Bridge Probe</title><style>*{box-sizing:border-box}html,body{margin:0;background:#080808;color:#fff;font-family:-apple-system,sans-serif}main{padding:18px}button{width:100%;margin:8px 0;padding:14px;border:0;border-radius:12px;background:#246fe5;color:#fff;font-size:16px}.danger{background:#d22}pre{white-space:pre-wrap;word-break:break-all;background:#151515;padding:12px;border-radius:10px;min-height:150px}</style></head><body><main><h2>APTV WebView bridge probe</h2><button id="scan">1. Quét bridge được expose</button><button id="scheme">2. Test scheme aptv://browser</button><button id="locYT">3. location.href → YouTube</button><button id="formYT">4. FORM _self → YouTube</button><button class="danger" id="history">5. Ghi trạng thái rồi điều hướng YouTube</button><pre id="log">Bấm 1 trước. Không iframe/object/popup.</pre><form id="f" method="GET" action="https://www.youtube.com/results" target="_self"><input type="hidden" name="search_query" value="APTV"></form><script>const L=document.getElementById('log');function out(x){L.textContent=typeof x==='string'?x:JSON.stringify(x,null,2)};document.getElementById('scan').onclick=()=>{const r={ua:navigator.userAgent,webkit:!!window.webkit,messageHandlers:window.webkit&&window.webkit.messageHandlers?Object.keys(window.webkit.messageHandlers):[],interesting:Object.keys(window).filter(k=>/aptv|bridge|native|webkit|browser|carplay/i.test(k)).slice(0,100)};out(r)};document.getElementById('scheme').onclick=()=>{out('Đang gọi aptv://browser?url=...');location.href='aptv://browser?url='+encodeURIComponent('https://www.youtube.com/')};document.getElementById('locYT').onclick=()=>{location.href='https://www.youtube.com/'};document.getElementById('formYT').onclick=()=>document.getElementById('f').submit();document.getElementById('history').onclick=()=>{sessionStorage.setItem('aptvProbe','before-youtube');location.assign('https://www.youtube.com/')};</script></body></html>

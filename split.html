<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>WebAPTV Video + Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#app{display:flex}.left{width:50%;flex:none;background:#000;display:flex;align-items:center}
.bar{width:12px;flex:none;background:#333;touch-action:none;z-index:1000}
.right{flex:1;min-width:0;position:relative;background:#ddd}
video{width:100%;height:100%;object-fit:contain;background:#000}
#map{position:absolute;inset:0;width:100%;height:100%}
.locate{position:absolute;right:12px;bottom:24px;z-index:1001;border:0;border-radius:10px;padding:12px 14px;font-size:16px}
</style>
</head>
<body>
<div id="app">
<section class="left" id="left"><video controls autoplay playsinline webkit-playsinline src="https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"></video></section>
<div class="bar" id="bar"></div>
<section class="right"><div id="map"></div><button class="locate" id="locate">Vị trí của tôi</button></section>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map',{zoomControl:true}).setView([15.8801,108.3380],13);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
L.marker([15.8801,108.3380]).addTo(map).bindPopup('Bản đồ WebAPTV');
document.getElementById('locate').onclick=()=>map.locate({setView:true,maxZoom:16,enableHighAccuracy:true});
map.on('locationfound',e=>L.marker(e.latlng).addTo(map).bindPopup('Vị trí hiện tại').openPopup());
const app=document.getElementById('app'),left=document.getElementById('left'),bar=document.getElementById('bar');
function move(x){const r=app.getBoundingClientRect();left.style.width=Math.max(15,Math.min(85,(x-r.left)/r.width*100))+'%';setTimeout(()=>map.invalidateSize(),0)}
bar.addEventListener('pointerdown',e=>{bar.setPointerCapture(e.pointerId);move(e.clientX)});
bar.addEventListener('pointermove',e=>{if(bar.hasPointerCapture(e.pointerId))move(e.clientX)});
setTimeout(()=>map.invalidateSize(),200);
</script>
</body></html>

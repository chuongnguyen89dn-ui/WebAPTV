<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>WebAPTV Split</title>
<style>
*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#05070a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#app{display:flex;position:relative}.pane{height:100%;min-width:0;position:relative;overflow:hidden}.left{width:50%;background:#000}.right{flex:1;background:#111}
.viewport{position:absolute;inset:0;overflow:hidden}.surface{position:absolute;inset:0;min-width:0;min-height:0;transform-origin:0 0}.frame{border:0;width:100%;height:100%;display:block}
.divider{position:relative;width:34px;min-width:34px;margin:0 -17px;z-index:9999;cursor:ew-resize;touch-action:none;display:flex;align-items:center;justify-content:center}
.divider:before{content:"↔";width:36px;height:64px;border-radius:18px;background:#111d;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:0 3px 15px #000}
.ytbar,.mapbar{position:absolute;z-index:20;left:8px;right:8px;top:8px;display:flex;gap:6px;padding:6px;border-radius:13px;background:#080b0fe8;backdrop-filter:blur(8px)}
.ytbar b{display:flex;align-items:center;white-space:nowrap}.ytbar input,.mapbar input{min-width:0;flex:1;border:0;outline:0;border-radius:10px;padding:10px;background:#fff;color:#111}.btn{border:0;border-radius:10px;padding:10px 12px;font-weight:750;color:#fff;background:#242a33;white-space:nowrap}.red{background:#e11}.blue{background:#087cff}
@media(max-width:520px){.ytbar b{display:none}.btn{padding:9px}.ytbar,.mapbar{gap:4px;padding:4px}}
</style></head><body>
<div id="app">
 <section id="left" class="pane left"><div class="viewport"><div id="ytSurface" class="surface">
  <iframe id="youtube" class="frame" title="YouTube" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen src="https://www.youtube.com/embed?listType=playlist&list=PLFgquLnL59alCl_2TQvOiD5Vgm1hCaGSI&playsinline=1"></iframe>
  <form id="ytForm" class="ytbar"><b>▶ YouTube</b><input id="ytInput" placeholder="Tìm video hoặc dán link YouTube…" autocomplete="off"><button class="btn red">Mở</button></form>
 </div></div></section>
 <div id="divider" class="divider" aria-label="Kéo để thay đổi tỷ lệ"></div>
 <section id="right" class="pane right"><div class="viewport"><div id="mapSurface" class="surface">
  <iframe id="map" class="frame" title="Google Maps" allow="geolocation" src="https://www.google.com/maps?q=16.0544,108.2022&z=13&output=embed"></iframe>
  <form id="mapForm" class="mapbar"><input id="place" placeholder="Tìm địa điểm, địa chỉ…" autocomplete="off"><button class="btn blue">Tìm</button><button id="gps" type="button" class="btn">◎</button></form>
 </div></div></section>
</div>
<script>
const $=id=>document.getElementById(id),app=$('app'),left=$('left'),divider=$('divider'),yt=$('youtube'),map=$('map');let dragging=false;
function setSplit(p){p=Math.max(12,Math.min(88,p));left.style.width=p+'%';left.style.flex='none';requestAnimationFrame(reflow)}
function dragAt(x){const r=app.getBoundingClientRect();setSplit((x-r.left)/r.width*100)}
divider.onpointerdown=e=>{dragging=true;e.preventDefault();divider.setPointerCapture?.(e.pointerId)};
divider.onpointermove=e=>{if(dragging){e.preventDefault();dragAt(e.clientX)}};divider.onpointerup=divider.onpointercancel=()=>dragging=false;
divider.addEventListener('touchstart',e=>{dragging=true;e.preventDefault()},{passive:false});divider.addEventListener('touchmove',e=>{if(dragging){e.preventDefault();dragAt(e.touches[0].clientX)}},{passive:false});divider.addEventListener('touchend',()=>dragging=false);
function reflow(){/* panes remain real responsive viewports: no clipping/transform, inputs and controls stay inside each pane */document.documentElement.style.setProperty('--leftW',left.getBoundingClientRect().width+'px')}
new ResizeObserver(reflow).observe(app);new ResizeObserver(reflow).observe(left);
function videoId(v){v=v.trim();try{const u=new URL(v);if(u.hostname.includes('youtu.be'))return u.pathname.slice(1).split('/')[0];if(u.searchParams.get('v'))return u.searchParams.get('v');const m=u.pathname.match(/\/(?:embed|shorts|live)\/([^/?]+)/);if(m)return m[1]}catch(e){}return /^[\w-]{11}$/.test(v)?v:null}
$('ytForm').onsubmit=e=>{e.preventDefault();const q=$('ytInput').value.trim();if(!q)return;const id=videoId(q);if(id){yt.src='https://www.youtube.com/embed/'+id+'?playsinline=1&autoplay=1'}else{window.open('https://m.youtube.com/results?search_query='+encodeURIComponent(q),'_blank')}};
$('mapForm').onsubmit=e=>{e.preventDefault();const q=$('place').value.trim();if(q)map.src='https://www.google.com/maps?q='+encodeURIComponent(q)+'&z=15&output=embed'};
$('gps').onclick=()=>navigator.geolocation?.getCurrentPosition(p=>{map.src='https://www.google.com/maps?q='+p.coords.latitude+','+p.coords.longitude+'&z=16&output=embed'},{},{enableHighAccuracy:true,timeout:12000});
setSplit(50);
</script></body></html>

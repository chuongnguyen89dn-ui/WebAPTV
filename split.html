<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>APTV runtime signature probe</title><style>*{box-sizing:border-box}html,body{margin:0;background:#080808;color:#fff;font-family:-apple-system,sans-serif}main{padding:16px}button{width:100%;margin:6px 0;padding:13px;border:0;border-radius:11px;background:#246fe5;color:#fff;font-size:15px}pre{white-space:pre-wrap;word-break:break-all;background:#151515;padding:12px;border-radius:10px;min-height:330px}</style></head><body><main><h2>runtime signature probe</h2><button id="sig">1. Quét function signature</button><button id="send">2. Thử các chữ ký sendMessage an toàn</button><button id="conn">3. Thử các chữ ký connect an toàn</button><pre id="log">Bấm 1 trước.</pre></main><script>const L=document.getElementById('log'),rt=browser.runtime;const s=f=>{try{return f()}catch(e){return '[ERR] '+e}};sig.onclick=()=>L.textContent=JSON.stringify({sendMessage:{length:s(()=>rt.sendMessage.length),name:s(()=>rt.sendMessage.name),string:s(()=>Function.prototype.toString.call(rt.sendMessage))},connect:{length:s(()=>rt.connect.length),name:s(()=>rt.connect.name),string:s(()=>Function.prototype.toString.call(rt.connect))}},null,2);send.onclick=async()=>{const tests=[[],[{}],[null],[undefined],[{type:'probe'}],['probe'],['probe',{}],['',{}],['aptv',{}],['com.aptv',{}]];let out=[];for(const a of tests){try{let p=rt.sendMessage(...a);let v=await Promise.race([Promise.resolve(p).then(x=>'RES '+JSON.stringify(x)).catch(e=>'REJ '+e),new Promise(r=>setTimeout(()=>r('TIMEOUT'),700))]);out.push(JSON.stringify(a)+' => '+v)}catch(e){out.push(JSON.stringify(a)+' => THROW '+e)}}L.textContent=out.join('\n\n')};conn.onclick=()=>{const tests=[[],[{}],[null],['probe'],['probe',{}],['',{}],['aptv',{}],['com.aptv',{}]];let out=[];for(const a of tests){try{let p=rt.connect(...a);out.push(JSON.stringify(a)+' => '+s(()=>Object.prototype.toString.call(p))+' keys='+s(()=>Reflect.ownKeys(p).map(String).join(','))+' proto='+s(()=>Object.getOwnPropertyNames(Object.getPrototypeOf(p)).join(',')))}catch(e){out.push(JSON.stringify(a)+' => THROW '+e)}}L.textContent=out.join('\n\n')};</script></body></html>

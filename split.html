<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>WebAPTV No-Frame Split</title><style>*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,sans-serif}#app{display:flex}.left{width:50%;flex:none;background:#000;display:flex;align-items:center}.right{flex:1;min-width:0;background:#111;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}.bar{width:12px;flex:none;background:#333;touch-action:none;z-index:5}video{width:100%;height:100%;object-fit:contain;background:#000}.maps a{display:block;padding:18px 22px;border-radius:14px;background:#16883d;color:#fff;text-decoration:none;font-size:18px}.maps small{display:block;margin-top:14px;opacity:.7}</style></head><body><div id="app"><section class="left" id="left"><video controls autoplay playsinline webkit-playsinline src="https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"></video></section><div class="bar" id="bar"></div><section class="right"><div class="maps"><a href="https://www.google.com/maps/">Mở Google Maps web gốc</a><small>Không iframe / object / popup. Maps mở top-level trong Browser hiện tại.</small></div></section></div><script>const app=document.getElementById('app'),left=document.getElementById('left'),bar=document.getElementById('bar');function move(x){const r=app.getBoundingClientRect();left.style.width=Math.max(15,Math.min(85,(x-r.left)/r.width*100))+'%'}bar.addEventListener('pointerdown',e=>{bar.setPointerCapture(e.pointerId);move(e.clientX)});bar.addEventListener('pointermove',e=>{if(bar.hasPointerCapture(e.pointerId))move(e.clientX)});</script></body></html>

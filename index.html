<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>WebAPTV</title><style>*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#05070a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}#app{display:flex;position:relative}.pane{height:100%;min-width:0;position:relative;overflow:hidden;background:#05070a}.left{width:50%}.right{flex:1;background:#10151d}.frame{border:0;width:100%;height:100%;display:block}.ytbar{position:absolute;z-index:20;left:8px;right:28px;top:8px;display:flex;gap:6px;padding:6px;border-radius:13px;background:#080b0fe8}.ytbar b{display:flex;align-items:center;font-size:14px;white-space:nowrap}.ytbar input,.mapSearch input{min-width:0;flex:1;border:0;outline:0;border-radius:10px;padding:9px 10px;background:#20242b;color:#fff}.btn{border:0;border-radius:10px;padding:9px 10px;font-weight:750;color:#fff;background:#242a33;white-space:nowrap}.blue{background:#087cff}.divider{position:relative;width:32px;min-width:32px;margin-left:-16px;margin-right:-16px;z-index:999;cursor:ew-resize;touch-action:none;display:flex;align-items:center;justify-content:center}.divider:before{content:"↔";position:absolute;width:34px;height:62px;display:flex;align-items:center;justify-content:center;border-radius:17px;background:#111820;border:2px solid #fff;color:#fff;font-size:18px;box-shadow:0 4px 18px #000}.mapTop{position:absolute;z-index:25;left:24px;right:8px;top:8px;display:flex;gap:5px}.switch{min-width:0;display:flex;gap:4px;padding:4px;border-radius:13px;background:#080b0fe8}.switch button{padding:8px}.switch button.active{background:#087cff}.mapSearch{position:absolute;z-index:24;left:24px;right:8px;top:58px;display:flex;gap:5px}.mapSearch input{background:#fff;color:#111}.mapBottom{position:absolute;z-index:24;left:24px;right:8px;bottom:8px;border-radius:14px;padding:7px;background:#080b0fe8;display:flex;align-items:center;gap:5px}.route{flex:1;min-width:0}.route strong{font-size:14px;color:#6ee7a5}.route small{display:block;color:#b8bec8;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mapBottom .btn{font-size:11px;padding:8px}.status{position:absolute;z-index:1000;left:50%;bottom:4px;transform:translateX(-50%);padding:4px 7px;border-radius:8px;background:#000b;font-size:9px;pointer-events:none}@media(max-width:600px){.ytbar b{display:none}.mapTop{flex-wrap:nowrap}.switch{flex:1}.switch button{flex:1;font-size:11px}.mapTop>.btn{font-size:0}.mapTop>.btn:after{content:'◎';font-size:18px}.mapBottom .route{display:none}}</style></head><body><div id="app"><section id="left" class="pane left"><iframe id="youtube" class="frame" title="YouTube" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen src="https://www.youtube.com/embed/jfKfPfyJRdk?playsinline=1&rel=0"></iframe><div class="ytbar"><b>▶ YouTube</b><input id="ytUrl" placeholder="YouTube"><button class="btn blue" id="ytLoad">Mở</button></div></section><div id="divider" class="divider"></div><section id="right" class="pane right"><iframe id="map" class="frame" title="Map" allow="geolocation" src="https://www.google.com/maps?q=16.0544,108.2022&z=13&output=embed"></iframe><div class="mapTop"><div class="switch"><button id="googleBtn" class="btn active">Google</button><button id="wazeBtn" class="btn">Waze</button></div><button id="gps" class="btn blue">◎ GPS</button></div><form id="mapSearch" class="mapSearch"><input id="place" placeholder="Tìm địa điểm…"><button class="btn blue">Tìm</button></form><div class="mapBottom"><div class="route"><strong id="routeTitle">Google Maps</strong><small id="routeInfo">Tìm điểm đến</small></div><button id="openGoogle" class="btn blue">Google ▶</button><button id="openWaze" class="btn">Waze ▶</button></div></section><div id="status" class="status">WebAPTV</div></div><script>const app=document.getElementById('app'),left=document.getElementById('left'),divider=document.getElementById('divider'),map=document.getElementById('map'),status=document.getElementById('status'),googleBtn=document.getElementById('googleBtn'),wazeBtn=document.getElementById('wazeBtn');let dragging=false,mode='google',gps=null,destination='';function setSplit(p){p=Math.max(12,Math.min(88,p));left.style.width=p+'%';left.style.flex='none'}function dragAt(x){const r=app.getBoundingClientRect();setSplit((x-r.left)/r.width*100)}divider.addEventListener('pointerdown',e=>{dragging=true;e.preventDefault();divider.setPointerCapture?.(e.pointerId)});divider.addEventListener('pointermove',e=>{if(dragging){e.preventDefault();dragAt(e.clientX)}});divider.addEventListener('pointerup',()=>dragging=false);divider.addEventListener('pointercancel',()=>dragging=false);divider.addEventListener('touchstart',e=>{dragging=true;e.preventDefault()},{passive:false});divider.addEventListener('touchmove',e=>{if(dragging){e.preventDefault();dragAt(e.touches[0].clientX)}},{passive:false});divider.addEventListener('touchend',()=>dragging=false);function videoId(v){v=v.trim();try{const u=new URL(v);if(u.hostname.includes('youtu.be'))return u.pathname.slice(1).split('/')[0];if(u.searchParams.get('v'))return u.searchParams.get('v');const m=u.pathname.match(/\/(?:embed|shorts|live)\/([^/?]+)/);if(m)return m[1]}catch(e){}return /^[\w-]{11}$/.test(v)?v:null}document.getElementById('ytLoad').onclick=()=>{const id=videoId(document.getElementById('ytUrl').value);if(id)document.getElementById('youtube').src='https://www.youtube.com/embed/'+id+'?playsinline=1&rel=0&autoplay=1';else status.textContent='Link YouTube lỗi'};function coords(){return gps?gps.lat+','+gps.lon:'16.0544,108.2022'}function googleMap(q){map.src='https://www.google.com/maps?q='+encodeURIComponent(q||coords())+'&z=15&output=embed'}function wazeMap(){map.src='https://embed.waze.com/iframe?zoom=15&lat='+(gps?.lat||16.0544)+'&lon='+(gps?.lon||108.2022)+'&ct=livemap'}function setMode(m){mode=m;googleBtn.classList.toggle('active',m==='google');wazeBtn.classList.toggle('active',m==='waze');document.getElementById('routeTitle').textContent=m==='google'?'Google Maps':'Waze';m==='google'?googleMap(destination):wazeMap()}googleBtn.onclick=()=>setMode('google');wazeBtn.onclick=()=>setMode('waze');document.getElementById('gps').onclick=()=>navigator.geolocation?.getCurrentPosition(p=>{gps={lat:p.coords.latitude,lon:p.coords.longitude};status.textContent='GPS ±'+Math.round(p.coords.accuracy)+'m';setMode(mode)},e=>status.textContent='GPS lỗi: '+e.message,{enableHighAccuracy:true,timeout:12000});document.getElementById('mapSearch').onsubmit=e=>{e.preventDefault();destination=document.getElementById('place').value.trim();if(destination){setMode('google');document.getElementById('routeInfo').textContent=destination}};document.getElementById('openGoogle').onclick=()=>window.open('https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(destination||coords())+(gps?'&origin='+encodeURIComponent(coords()):'')+'&travelmode=driving','_blank');document.getElementById('openWaze').onclick=()=>window.open('https://www.waze.com/ul?ll='+encodeURIComponent(coords())+'&navigate=yes','_blank');setSplit(50);</script></body></html>

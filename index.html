<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0c121d"><title>WebAPTV — Split View</title><link rel="stylesheet" href="style.css"></head><body><main class="split-shell"><nav class="media-nav"><b class="brand">WebAPTV</b><button id="youtubeTab" class="active"><img src="velora-source/assets/icon-youtube-3d.svg" alt="">YouTube</button><button id="tvTab"><img src="velora-source/assets/icon-tv-3d.svg" alt="">TV</button><button id="appsTab"><img src="velora-source/assets/icon-apps-3d.svg" alt="">Apps</button></nav><div class="split-grid"><section id="videoPanel" class="video-panel"><div class="video-head"><strong><span class="yt-mark">▶</span> YouTube</strong><button id="fullBtn" type="button">Toàn màn hình</button></div><form id="videoForm"><input id="videoInput" placeholder="Tìm bài hát, video, kênh…" autocomplete="off"><button type="submit">Tìm</button></form><nav class="browse"><button>Âm nhạc</button><button>Thư giãn</button><button>Khám phá</button><button id="recentBtn">Gần đây</button><button>Bài đã lưu</button></nav><div class="screen-area"><div class="empty-player"><span>▶</span><h1>Hôm nay nghe gì?</h1><p>Chọn danh mục hoặc tìm video yêu thích.</p></div></div><div class="feedback">Chọn video để phát ngay tại đây.<a href="https://www.youtube.com/">YouTube gốc ↗</a></div></section><section id="tvPanel" class="video-panel" hidden><div class="video-head"><strong>Truyền hình</strong><button id="tvFull" type="button">Toàn màn hình</button></div><div class="screen-area"><div class="empty-player"><span>▣</span><h1>Danh sách TV</h1><p>Chọn kênh để phát.</p></div></div></section><div id="divider" class="divider" aria-label="Thay đổi kích thước">↔</div><aside class="instruments"><section class="clock-card"><strong id="clock">--:--</strong><small>Đồng hồ</small></section><section class="speed-card"><strong id="speed">0</strong><small>km/h · GPS</small></section><section class="utility-card"><button id="mapToggle">Bản đồ</button><button id="playlistToggle">Playlist</button></section><section id="workspacePanel" class="workspace-panel" hidden></section></aside></div><footer class="drive-dock"><b>WebAPTV</b><span>SPLIT VIEW</span><button id="swap" type="button"><img src="velora-source/assets/icon-swap-3d.svg" alt="">Đổi bên</button><button id="options" type="button"><img src="velora-source/assets/icon-widgets-3d.svg" alt="">Tiện ích</button><button id="fit" type="button"><img src="velora-source/assets/icon-fit-3d.svg" alt="">Fit 100%</button></footer><dialog id="optionsSheet"><header><strong>Màn hình & playlist</strong><button id="closeOptions">×</button></header><label><input id="prefWeather" type="checkbox" checked> Hiện đồng hồ</label><label><input id="prefGps" type="checkbox" checked> Hiện tốc độ GPS</label><label><input id="prefPlaylist" type="checkbox"> Hiện playlist YouTube bên phải</label><label><input id="prefMap" type="checkbox"> Hiện bản đồ bên phải</label><label><input id="prefAuto" type="checkbox"> Tự chuyển bài trong playlist</label></dialog></main><script src="app.js"></script></body></html>

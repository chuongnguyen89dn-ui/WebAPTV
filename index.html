<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>WebAPTV</title>
<style>*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#05070a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}#app{display:flex;position:relative}.pane{height:100%;min-width:0;position:relative;overflow:hidden;background:#05070a}.left{width:50%}.right{flex:1;background:#10151d}.frame{border:0;width:100%;height:100%;display:block}.ytbar{position:absolute;z-index:20;left:12px;right:12px;top:12px;display:flex;gap:8px;padding:8px;border-radius:16px;background:rgba(6,8,12,.88);backdrop-filter:blur(14px)}.ytbar b{display:flex;align-items:center;padding:0 7px;font-size:20px}.ytbar input,.mapSearch input{min-width:0;flex:1;border:0;outline:0;border-radius:12px;padding:11px 13px;background:#20242b;color:#fff}.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:750;color:#fff;background:#242a33}.blue{background:#087cff}.divider{width:44px;margin-left:-22px;margin-right:-22px;z-index:80;cursor:ew-resize;touch-action:none;display:flex;align-items:center;justify-content:center}.divider:before{content:"⋮";font-size:28px;line-height:54px;text-align:center;width:28px;height:58px;border-radius:15px;background:#242831;border:1px solid #555;color:#fff;box-shadow:0 4px 18px #000}.mapTop{position:absolute;z-index:25;left:12px;right:12px;top:12px;display:flex;gap:8px}.switch{display:flex;gap:6px;padding:5px;border-radius:15px;background:rgba(10,13,18,.9);backdrop-filter:blur(14px)}.switch button.active{background:#087cff}.mapSearch{position:absolute;z-index:24;left:12px;right:12px;top:70px;display:flex;gap:8px}.mapSearch input{background:#fff;color:#111;box-shadow:0 2px 12px #0005}.mapBottom{position:absolute;z-index:24;left:12px;right:12px;bottom:12px;min-height:72px;border-radius:17px;padding:10px 12px;background:rgba(10,13,18,.9);backdrop-filter:blur(14px);display:flex;align-items:center;gap:10px}.route{flex:1;min-width:0}.route strong{font-size:19px;color:#6ee7a5}.route small{display:block;color:#b8bec8;margin-top:3px}.status{position:absolute;z-index:100;left:50%;bottom:9px;transform:translateX(-50%);padding:6px 10px;border-radius:10px;background:#000b;font-size:11px;pointer-events:none}@media(max-width:700px){.ytbar b{font-size:15px}.btn{padding:9px}.mapTop{gap:4px}.switch{flex:1}.switch button{flex:1}.mapSearch{top:66px}.route small{font-size:10px}}
</style></head><body><div id="app">
<section id="left" class="pane left"><iframe id="youtube" class="frame" title="YouTube" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen src="https://www.youtube.com/embed/jfKfPfyJRdk?playsinline=1&rel=0"></iframe><div class="ytbar"><b>▶ YouTube</b><input id="ytUrl" placeholder="Dán link / ID YouTube"><button class="btn blue" id="ytLoad">Mở</button></div></section>
<div id="divider" class="divider"></div>
<section id="right" class="pane right"><iframe id="map" class="frame" title="Map" allow="geolocation" src="https://www.google.com/maps?q=16.0544,108.2022&z=13&output=embed"></iframe><div class="mapTop"><div class="switch"><button id="googleBtn" class="btn active">Google Maps</button><button id="wazeBtn" class="btn">Waze</button></div><button id="gps" class="btn blue">◎ GPS</button></div><form id="mapSearch" class="mapSearch"><input id="place" placeholder="Tìm địa điểm, địa chỉ…"><button class="btn blue">Tìm</button></form><div class="mapBottom"><div class="route"><strong id="routeTitle">Google Maps</strong><small id="routeInfo">Chọn vị trí hoặc tìm điểm đến</small></div><button id="openGoogle" class="btn blue">Bắt đầu Google</button><button id="openWaze" class="btn">Đi bằng Waze</button></div></section>
<div id="status" class="status">WebAPTV · Google/Waze test</div></div>
<script>
const app=document.getElementById('app'),left=document.getElementById('left'),divider=document.getElementById('divider'),map=document.getElementById('map'),status=document.getElementById('status');let dragging=false,lastPct=50,mode='google',gps=null,destination='';
function setSplit(p){p=Math.max(25,Math.min(75,p));lastPct=p;left.style.width=p+'%'}function move(e){if(!dragging)return;e.preventDefault();const r=app.getBoundingClientRect();setSplit((e.clientX-r.left)/r.width*100)}divider.onpointerdown=e=>{dragging=true;divider.setPointerCapture?.(e.pointerId)};divider.onpointermove=move;divider.onpointerup=divider.onpointercancel=()=>dragging=false;
function videoId(v){v=v.trim();try{const u=new URL(v);if(u.hostname.includes('youtu.be'))return u.pathname.slice(1).split('/')[0];if(u.searchParams.get('v'))return u.searchParams.get('v');const m=u.pathname.match(/\/(?:embed|shorts|live)\/([^/?]+)/);if(m)return m[1]}catch(e){}return /^[\w-]{11}$/.test(v)?v:null}document.getElementById('ytLoad').onclick=()=>{const id=videoId(document.getElementById('ytUrl').value);if(!id)return status.textContent='Link YouTube không hợp lệ';document.getElementById('youtube').src='https://www.youtube.com/embed/'+id+'?playsinline=1&rel=0&autoplay=1';};
function coords(){return gps?gps.lat+','+gps.lon:'16.0544,108.2022'}function googleMap(q){map.src='https://www.google.com/maps?q='+encodeURIComponent(q||coords())+'&z=15&output=embed'}function wazeMap(){map.src='https://embed.waze.com/iframe?zoom=15&lat='+(gps?.lat||16.0544)+'&lon='+(gps?.lon||108.2022)+'&ct=livemap'}function setMode(m){mode=m;document.getElementById('googleBtn').classList.toggle('active',m==='google');document.getElementById('wazeBtn').classList.toggle('active',m==='waze');document.getElementById('routeTitle').textContent=m==='google'?'Google Maps':'Waze Live Map';m==='google'?googleMap(destination):wazeMap()}googleBtn.onclick=()=>setMode('google');wazeBtn.onclick=()=>setMode('waze');
document.getElementById('gps').onclick=()=>{if(!navigator.geolocation)return status.textContent='WebView không hỗ trợ GPS';status.textContent='Đang lấy GPS…';navigator.geolocation.getCurrentPosition(p=>{gps={lat:p.coords.latitude,lon:p.coords.longitude};status.textContent='GPS OK ±'+Math.round(p.coords.accuracy)+'m';document.getElementById('routeInfo').textContent='Vị trí hiện tại · ±'+Math.round(p.coords.accuracy)+'m';setMode(mode)},e=>status.textContent='GPS lỗi: '+e.message,{enableHighAccuracy:true,timeout:12000,maximumAge:0})};
document.getElementById('mapSearch').onsubmit=e=>{e.preventDefault();destination=document.getElementById('place').value.trim();if(!destination)return;if(mode!=='google')setMode('google');else googleMap(destination);document.getElementById('routeInfo').textContent='Điểm đến: '+destination};
function navUrl(kind){const d=destination||coords();if(kind==='google'){const o=gps?'&origin='+encodeURIComponent(coords()):'';return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(d)+o+'&travelmode=driving'}return 'https://www.waze.com/ul?ll='+encodeURIComponent(destination?destination:coords())+'&navigate=yes'}document.getElementById('openGoogle').onclick=()=>window.open(navUrl('google'),'_blank');document.getElementById('openWaze').onclick=()=>{if(destination&&!/^[-\d.]+,[-\d.]+$/.test(destination)){window.open('https://www.waze.com/live-map/directions?to=place.'+encodeURIComponent(destination),'_blank')}else window.open(navUrl('waze'),'_blank')};setSplit(50);
</script></body></html>

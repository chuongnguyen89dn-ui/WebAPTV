<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.55,maximum-scale=1.55,user-scalable=no,viewport-fit=cover"><title>WebAPTV</title>
<style>*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}#app{display:flex;position:relative}.pane{height:100%;min-width:0;position:relative;overflow:hidden;background:#000}.left{width:50%}.right{flex:1;background:#111}iframe{border:0;width:100%;height:100%;display:block}.ytSetup{position:absolute;z-index:8;left:14px;bottom:14px;right:14px;display:flex;gap:8px;background:rgba(0,0,0,.72);padding:8px;border-radius:12px}.ytSetup input{min-width:0;flex:1;border:0;border-radius:9px;padding:11px;font-size:15px}.ytSetup button,.toolbar button{border:0;border-radius:9px;padding:11px 14px;font-weight:700}.divider{width:48px;margin-left:-24px;margin-right:-24px;z-index:50;cursor:ew-resize;touch-action:none;display:flex;align-items:center;justify-content:center}.divider:before{content:"";height:120px;width:8px;border-radius:8px;background:#fff;box-shadow:0 0 0 9px rgba(0,0,0,.35)}.toolbar{position:absolute;z-index:60;top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:6px;border-radius:12px;background:rgba(0,0,0,.7)}.status{position:absolute;z-index:60;right:10px;bottom:10px;padding:8px 10px;border-radius:9px;background:rgba(0,0,0,.72);font-size:12px}</style></head><body>
<div id="app"><section id="left" class="pane left"><iframe id="youtube" title="YouTube" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen src="https://www.youtube.com/embed/jfKfPfyJRdk?playsinline=1&rel=0"></iframe><div class="ytSetup"><input id="ytUrl" placeholder="Dán link YouTube"><button id="ytLoad">Mở</button></div></section><div id="divider" class="divider"></div><section id="right" class="pane right"><iframe id="map" title="Waze Live Map" allow="geolocation" src="https://embed.waze.com/iframe?zoom=13&lat=16.4637&lon=107.5909&ct=livemap"></iframe></section><div class="toolbar"><button data-size="35">35/65</button><button data-size="50">50/50</button><button data-size="65">65/35</button><button id="ytFull">YT</button><button id="mapFull">Map</button><button id="split">Split</button><button id="gps">GPS</button></div><div id="status" class="status">YouTube + Waze</div></div>
<script>const app=document.getElementById('app'),left=document.getElementById('left'),right=document.getElementById('right'),divider=document.getElementById('divider'),status=document.getElementById('status'),map=document.getElementById('map');let dragging=false,lastPct=50;function setSplit(p){p=Math.max(15,Math.min(85,p));lastPct=p;left.style.display='block';right.style.display='block';left.style.width=p+'%';divider.style.display='flex'}function move(e){if(!dragging)return;e.preventDefault();const r=app.getBoundingClientRect();setSplit((e.clientX-r.left)/r.width*100)}divider.onpointerdown=e=>{dragging=true;divider.setPointerCapture?.(e.pointerId)};divider.onpointermove=move;divider.onpointerup=divider.onpointercancel=()=>dragging=false;document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>setSplit(+b.dataset.size));document.getElementById('ytFull').onclick=()=>{left.style.display='block';left.style.width='100%';right.style.display='none';divider.style.display='none'};document.getElementById('mapFull').onclick=()=>{left.style.display='none';right.style.display='block';divider.style.display='none'};document.getElementById('split').onclick=()=>setSplit(lastPct);function videoId(v){v=v.trim();try{const u=new URL(v);if(u.hostname.includes('youtu.be'))return u.pathname.slice(1).split('/')[0];if(u.searchParams.get('v'))return u.searchParams.get('v');const m=u.pathname.match(/\/(?:embed|shorts|live)\/([^/?]+)/);if(m)return m[1]}catch(e){}return /^[\w-]{11}$/.test(v)?v:null}document.getElementById('ytLoad').onclick=()=>{const id=videoId(document.getElementById('ytUrl').value);if(!id){status.textContent='Link YouTube không hợp lệ';return}document.getElementById('youtube').src='https://www.youtube.com/embed/'+id+'?playsinline=1&rel=0&autoplay=1';status.textContent='Đã nạp YouTube'};document.getElementById('gps').onclick=()=>{if(!navigator.geolocation){status.textContent='Không có GPS';return}status.textContent='Đang lấy GPS…';navigator.geolocation.getCurrentPosition(p=>{const {latitude,longitude,accuracy}=p.coords;map.src=`https://embed.waze.com/iframe?zoom=16&lat=${latitude}&lon=${longitude}&ct=livemap`;status.textContent=`GPS OK ±${Math.round(accuracy)}m`},e=>status.textContent='GPS lỗi: '+e.message,{enableHighAccuracy:true,timeout:12000,maximumAge:0})};setSplit(50);</script></body></html>

<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>WebAPTV Drive</title><style>*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#05070a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}#app{display:flex;position:relative}.pane{height:100%;min-width:0;position:relative;overflow:hidden}.left{width:50%;background:#000}.right{flex:1;background:#111}.frame{border:0;width:100%;height:100%;display:block}.divider{position:relative;width:34px;min-width:34px;margin:0 -17px;z-index:9999;touch-action:none;display:flex;align-items:center;justify-content:center}.divider:before{content:"↔";width:36px;height:64px;border-radius:18px;background:#111a;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:0 3px 15px #000}.ytOpen{position:absolute;z-index:30;left:8px;bottom:8px;border:0;border-radius:13px;padding:11px 14px;background:#f00;color:#fff;font-weight:800}.top{position:absolute;z-index:40;left:24px;right:8px;top:8px;display:flex;gap:5px}.switch{display:flex;flex:1;gap:4px;padding:4px;border-radius:14px;background:#090d12e8}.btn{border:0;border-radius:11px;padding:10px 11px;background:#252b34;color:#fff;font-weight:800;white-space:nowrap}.switch .btn{flex:1}.active,.blue{background:#087cff}.directions{position:absolute;z-index:39;left:24px;right:8px;top:62px;padding:7px;border-radius:15px;background:#090d12e8;display:grid;grid-template-columns:1fr auto;gap:5px}.field{height:42px;border:0;outline:0;border-radius:11px;padding:0 11px;background:#fff;color:#111;min-width:0}.origin{background:#202731;color:#dbe4ee}.go{grid-row:1/3;grid-column:2;height:89px;min-width:72px;background:#14a44d;font-size:15px}.go.ready{background:#087cff}.mapTools{position:absolute;z-index:39;right:9px;bottom:82px;display:flex;flex-direction:column;gap:5px}.mapTools .btn{font-size:20px;width:46px;height:46px;padding:0}.bottom{position:absolute;z-index:39;left:24px;right:8px;bottom:8px;height:66px;padding:7px;border-radius:15px;background:#090d12e8;display:flex;align-items:center;gap:6px}.info{flex:1;min-width:0}.info b{display:block;color:#7df0ad;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.info small{color:#adb7c3}.bottom .btn{font-size:11px;padding:9px}.driving .directions{display:none}.driving .top{opacity:.92}.driveHud{display:none;position:absolute;z-index:45;left:24px;right:70px;top:64px;padding:9px 12px;border-radius:14px;background:#090d12ee}.driving .driveHud{display:block}.driveHud b{display:block;color:#7df0ad;font-size:16px}.driveHud small{color:#d2d8df}.status{position:absolute;z-index:10000;left:50%;bottom:3px;transform:translateX(-50%);font-size:9px;background:#000c;border-radius:8px;padding:4px 7px;pointer-events:none}@media(max-width:620px){.top .btn{font-size:11px;padding:9px 6px}.directions{grid-template-columns:1fr 64px}.go{min-width:64px;font-size:12px}.bottom .info{display:none}.bottom .btn{flex:1}.ytOpen{font-size:12px;padding:9px}}</style></head><body><div id="app"><section id="left" class="pane left"><iframe id="youtube" class="frame" title="YouTube" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen src="https://www.youtube.com/embed?listType=playlist&list=PLFgquLnL59alCl_2TQvOiD5Vgm1hCaGSI&playsinline=1"></iframe><button id="ytBrowse" class="ytOpen">▶ YouTube</button></section><div id="divider" class="divider"></div><section id="right" class="pane right"><iframe id="map" class="frame" title="Map" allow="geolocation" src="https://www.google.com/maps?q=16.0544,108.2022&z=17&output=embed"></iframe><div class="top"><div class="switch"><button id="googleBtn" class="btn active">Google</button><button id="wazeBtn" class="btn">Waze</button></div><button id="gpsBtn" class="btn blue">◎ GPS</button></div><div class="directions"><input id="origin" class="field origin" value="● Vị trí hiện tại"><input id="destination" class="field" placeholder="▼ Điểm đến…"><button id="goBtn" class="btn go">XEM TUYẾN</button></div><div class="driveHud"><b id="driveTitle">ĐANG ĐI</b><small id="driveInfo">Đang theo vị trí GPS</small></div><div class="mapTools"><button id="recenter" class="btn">◎</button><button id="zoomIn" class="btn">+</button><button id="zoomOut" class="btn">−</button></div><div class="bottom"><div class="info"><b id="routeTitle">Sẵn sàng</b><small id="routeInfo">GPS → điểm đến → XEM TUYẾN</small></div><button id="startBtn" class="btn blue">BẮT ĐẦU</button><button id="stopBtn" class="btn" style="display:none">KẾT THÚC</button></div></section><div id="status" class="status">WebAPTV Drive</div></div><script>const $=id=>document.getElementById(id),app=$('app'),left=$('left'),divider=$('divider'),map=$('map'),right=$('right');let dragging=false,gps=null,mode='google',dest='',zoom=17,routeReady=false,driving=false,watchId=null,lastMapUpdate=0;function setSplit(p){p=Math.max(14,Math.min(86,p));left.style.width=p+'%';left.style.flex='none'}function drag(x){const r=app.getBoundingClientRect();setSplit((x-r.left)/r.width*100)}divider.onpointerdown=e=>{dragging=true;e.preventDefault();divider.setPointerCapture?.(e.pointerId)};divider.onpointermove=e=>{if(dragging){e.preventDefault();drag(e.clientX)}};divider.onpointerup=divider.onpointercancel=()=>dragging=false;divider.addEventListener('touchstart',e=>{dragging=true;e.preventDefault()},{passive:false});divider.addEventListener('touchmove',e=>{if(dragging){e.preventDefault();drag(e.touches[0].clientX)}},{passive:false});divider.addEventListener('touchend',()=>dragging=false);function c(){return gps?gps.lat+','+gps.lon:'16.0544,108.2022'}function googleView(q,z=zoom){map.src='https://www.google.com/maps?q='+encodeURIComponent(q||c())+'&z='+z+'&output=embed'}function googleRoute(){if(!dest)return;const o=gps?c():$('origin').value.replace(/^●\s*/,'');map.src='https://www.google.com/maps?saddr='+encodeURIComponent(o)+'&daddr='+encodeURIComponent(dest)+'&output=embed';routeReady=true;$('goBtn').textContent='BẮT ĐẦU';$('goBtn').classList.add('ready');$('routeTitle').textContent='Tuyến đường sẵn sàng';$('routeInfo').textContent='Bấm BẮT ĐẦU — vẫn ở WebAPTV'}function wazeView(){map.src='https://embed.waze.com/iframe?zoom=17&lat='+(gps?.lat||16.0544)+'&lon='+(gps?.lon||108.2022)+'&ct=livemap'}function setMode(m){mode=m;$('googleBtn').classList.toggle('active',m==='google');$('wazeBtn').classList.toggle('active',m==='waze');if(driving)return;m==='google'?(dest?googleRoute():googleView()):wazeView()}$('googleBtn').onclick=()=>setMode('google');$('wazeBtn').onclick=()=>setMode('waze');function gotPos(p,cb){gps={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy,speed:p.coords.speed};$('origin').value='● Vị trí hiện tại';$('status').textContent='GPS ±'+Math.round(p.coords.accuracy)+'m';cb?.()}function getGPS(cb){if(!navigator.geolocation)return $('status').textContent='WebView không hỗ trợ GPS';navigator.geolocation.getCurrentPosition(p=>gotPos(p,cb),e=>$('status').textContent='GPS lỗi: '+e.message,{enableHighAccuracy:true,timeout:12000,maximumAge:2000})}$('gpsBtn').onclick=()=>getGPS(()=>driving?updateDriveMap(true):setMode(mode));$('recenter').onclick=()=>{zoom=17;driving?updateDriveMap(true):(gps?setMode(mode):getGPS(()=>setMode(mode)))};$('zoomIn').onclick=()=>{zoom=Math.min(20,zoom+1);driving?updateDriveMap(true):(!dest&&mode==='google'&&googleView(null,zoom))};$('zoomOut').onclick=()=>{zoom=Math.max(14,zoom-1);driving?updateDriveMap(true):(!dest&&mode==='google'&&googleView(null,zoom))};$('destination').oninput=()=>{routeReady=false;$('goBtn').textContent='XEM TUYẾN';$('goBtn').classList.remove('ready')};$('goBtn').onclick=()=>{dest=$('destination').value.trim();if(!dest)return $('status').textContent='Nhập điểm đến';if(routeReady)return startDrive();mode='google';$('googleBtn').classList.add('active');$('wazeBtn').classList.remove('active');gps?googleRoute():getGPS(googleRoute)};$('destination').addEventListener('keydown',e=>{if(e.key==='Enter'){$('goBtn').click();e.preventDefault()}});function updateDriveMap(force=false){if(!gps||!dest)return;const now=Date.now();if(!force&&now-lastMapUpdate<5000)return;lastMapUpdate=now;map.src='https://www.google.com/maps?saddr='+encodeURIComponent(c())+'&daddr='+encodeURIComponent(dest)+'&output=embed';const kmh=gps.speed!=null&&gps.speed>=0?Math.round(gps.speed*3.6):null;$('driveTitle').textContent=kmh!=null?'ĐANG ĐI · '+kmh+' km/h':'ĐANG ĐI';$('driveInfo').textContent='GPS ±'+Math.round(gps.acc||0)+'m · '+dest}function startDrive(){if(driving)return;dest=$('destination').value.trim()||dest;if(!dest)return $('status').textContent='Nhập điểm đến';driving=true;right.classList.add('driving');$('startBtn').style.display='none';$('stopBtn').style.display='block';$('routeTitle').textContent='Đang đi';$('routeInfo').textContent='WebAPTV vẫn mở · GPS đang theo dõi';updateDriveMap(true);if(navigator.geolocation)watchId=navigator.geolocation.watchPosition(p=>{gotPos(p);updateDriveMap(false)},e=>$('status').textContent='GPS lỗi: '+e.message,{enableHighAccuracy:true,maximumAge:1000,timeout:15000})}function stopDrive(){driving=false;right.classList.remove('driving');if(watchId!=null){navigator.geolocation.clearWatch(watchId);watchId=null}$('startBtn').style.display='block';$('stopBtn').style.display='none';routeReady=true;$('routeTitle').textContent='Đã dừng theo dõi';$('routeInfo').textContent='Bấm BẮT ĐẦU để tiếp tục';googleRoute()}$('startBtn').onclick=()=>{dest=$('destination').value.trim()||dest;if(!dest)return $('status').textContent='Nhập điểm đến';routeReady?startDrive():(gps?googleRoute():getGPS(googleRoute))};$('stopBtn').onclick=stopDrive;$('ytBrowse').onclick=()=>window.open('https://m.youtube.com/','_blank');setSplit(50);getGPS(()=>googleView(null,17));</script></body></html>

<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>WebAPTV Drive</title><style>*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#05070a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}#app{display:flex;position:relative}.pane{height:100%;min-width:0;position:relative;overflow:hidden}.left{width:50%;background:#000}.right{flex:1;background:#111}.frame{border:0;width:100%;height:100%;display:block}.divider{position:relative;width:34px;min-width:34px;margin:0 -17px;z-index:9999;touch-action:none;display:flex;align-items:center;justify-content:center}.divider:before{content:"↔";width:36px;height:64px;border-radius:18px;background:#111a;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:0 3px 15px #000}.ytOpen{position:absolute;z-index:30;left:8px;bottom:8px;border:0;border-radius:13px;padding:11px 14px;background:#f00;color:#fff;font-weight:800}.top{position:absolute;z-index:40;left:24px;right:8px;top:8px;display:flex;gap:5px}.switch{display:flex;flex:1;gap:4px;padding:4px;border-radius:14px;background:#090d12e8}.btn{border:0;border-radius:11px;padding:10px 11px;background:#252b34;color:#fff;font-weight:800;white-space:nowrap}.switch .btn{flex:1}.active,.blue{background:#087cff}.directions{position:absolute;z-index:39;left:24px;right:8px;top:62px;padding:7px;border-radius:15px;background:#090d12e8;display:grid;grid-template-columns:1fr auto;gap:5px}.field{height:42px;border:0;outline:0;border-radius:11px;padding:0 11px;background:#fff;color:#111;min-width:0}.origin{background:#202731;color:#dbe4ee}.go{grid-row:1/3;grid-column:2;height:89px;min-width:62px;background:#14a44d;font-size:18px}.mapTools{position:absolute;z-index:39;right:9px;bottom:82px;display:flex;flex-direction:column;gap:5px}.mapTools .btn{font-size:20px;width:46px;height:46px;padding:0}.bottom{position:absolute;z-index:39;left:24px;right:8px;bottom:8px;height:66px;padding:7px;border-radius:15px;background:#090d12e8;display:flex;align-items:center;gap:6px}.info{flex:1;min-width:0}.info b{display:block;color:#7df0ad;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.info small{color:#adb7c3}.bottom .btn{font-size:11px;padding:9px}.status{position:absolute;z-index:10000;left:50%;bottom:3px;transform:translateX(-50%);font-size:9px;background:#000c;border-radius:8px;padding:4px 7px;pointer-events:none}@media(max-width:620px){.top .btn{font-size:11px;padding:9px 6px}.directions{grid-template-columns:1fr 52px}.go{min-width:52px;font-size:15px}.bottom .info{display:none}.bottom .btn{flex:1}.ytOpen{font-size:12px;padding:9px}}</style></head><body><div id="app"><section id="left" class="pane left"><iframe id="youtube" class="frame" title="YouTube" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen src="https://www.youtube.com/embed?listType=playlist&list=PLFgquLnL59alCl_2TQvOiD5Vgm1hCaGSI&playsinline=1"></iframe><button id="ytBrowse" class="ytOpen">▶ YouTube</button></section><div id="divider" class="divider"></div><section id="right" class="pane right"><iframe id="map" class="frame" title="Map" allow="geolocation" src="https://www.google.com/maps?q=16.0544,108.2022&z=17&output=embed"></iframe><div class="top"><div class="switch"><button id="googleBtn" class="btn active">Google</button><button id="wazeBtn" class="btn">Waze</button></div><button id="gpsBtn" class="btn blue">◎ GPS</button></div><div class="directions"><input id="origin" class="field origin" value="● Vị trí hiện tại" aria-label="Điểm đi"><input id="destination" class="field" placeholder="▼ Điểm đến…" aria-label="Điểm đến"><button id="goBtn" class="btn go">ĐI</button></div><div class="mapTools"><button id="recenter" class="btn">◎</button><button id="zoomIn" class="btn">+</button><button id="zoomOut" class="btn">−</button></div><div class="bottom"><div class="info"><b id="routeTitle">Sẵn sàng</b><small id="routeInfo">GPS → nhập điểm đến → ĐI</small></div><button id="googleNav" class="btn blue">Google ▶</button><button id="wazeNav" class="btn">Waze ▶</button></div></section><div id="status" class="status">WebAPTV Drive</div></div><script>const $=id=>document.getElementById(id),app=$('app'),left=$('left'),divider=$('divider'),map=$('map');let dragging=false,gps=null,mode='google',dest='',zoom=17;function setSplit(p){p=Math.max(14,Math.min(86,p));left.style.width=p+'%';left.style.flex='none'}function drag(x){const r=app.getBoundingClientRect();setSplit((x-r.left)/r.width*100)}divider.onpointerdown=e=>{dragging=true;e.preventDefault();divider.setPointerCapture?.(e.pointerId)};divider.onpointermove=e=>{if(dragging){e.preventDefault();drag(e.clientX)}};divider.onpointerup=divider.onpointercancel=()=>dragging=false;divider.addEventListener('touchstart',e=>{dragging=true;e.preventDefault()},{passive:false});divider.addEventListener('touchmove',e=>{if(dragging){e.preventDefault();drag(e.touches[0].clientX)}},{passive:false});divider.addEventListener('touchend',()=>dragging=false);function c(){return gps?gps.lat+','+gps.lon:'16.0544,108.2022'}function googleView(q,z=zoom){map.src='https://www.google.com/maps?q='+encodeURIComponent(q||c())+'&z='+z+'&output=embed'}function googleRoute(){const o=gps?c():$('origin').value.replace(/^●\s*/,''),d=dest;if(!d)return;map.src='https://www.google.com/maps?saddr='+encodeURIComponent(o)+'&daddr='+encodeURIComponent(d)+'&output=embed';$('routeTitle').textContent='Đang hiển thị tuyến đường';$('routeInfo').textContent=(gps?'GPS':'Điểm đi')+' → '+d}function wazeView(){map.src='https://embed.waze.com/iframe?zoom=17&lat='+(gps?.lat||16.0544)+'&lon='+(gps?.lon||108.2022)+'&ct=livemap'}function setMode(m){mode=m;$('googleBtn').classList.toggle('active',m==='google');$('wazeBtn').classList.toggle('active',m==='waze');m==='google'?(dest?googleRoute():googleView()):wazeView()}$('googleBtn').onclick=()=>setMode('google');$('wazeBtn').onclick=()=>setMode('waze');function getGPS(cb){if(!navigator.geolocation){$('status').textContent='WebView không hỗ trợ GPS';return}navigator.geolocation.getCurrentPosition(p=>{gps={lat:p.coords.latitude,lon:p.coords.longitude};$('origin').value='● Vị trí hiện tại';$('status').textContent='GPS ±'+Math.round(p.coords.accuracy)+'m';cb?.() },e=>$('status').textContent='GPS lỗi: '+e.message,{enableHighAccuracy:true,timeout:12000,maximumAge:3000})}$('gpsBtn').onclick=()=>getGPS(()=>setMode(mode));$('recenter').onclick=()=>{zoom=17;gps?setMode(mode):getGPS(()=>setMode(mode))};$('zoomIn').onclick=()=>{zoom=Math.min(20,zoom+1);if(mode==='google'&&!dest)googleView(null,zoom)};$('zoomOut').onclick=()=>{zoom=Math.max(14,zoom-1);if(mode==='google'&&!dest)googleView(null,zoom)};$('goBtn').onclick=()=>{dest=$('destination').value.trim();if(!dest){$('status').textContent='Nhập điểm đến';return}mode='google';$('googleBtn').classList.add('active');$('wazeBtn').classList.remove('active');if(gps)googleRoute();else getGPS(googleRoute)};$('destination').addEventListener('keydown',e=>{if(e.key==='Enter'){$('goBtn').click();e.preventDefault()}});$('googleNav').onclick=()=>{dest=$('destination').value.trim()||dest;if(!dest)return $('status').textContent='Nhập điểm đến';window.open('https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(dest)+(gps?'&origin='+encodeURIComponent(c()):'')+'&travelmode=driving','_blank')};$('wazeNav').onclick=()=>{dest=$('destination').value.trim()||dest;if(!dest)return $('status').textContent='Nhập điểm đến';window.open('https://www.waze.com/live-map/directions?to='+encodeURIComponent(dest),'_blank')};$('ytBrowse').onclick=()=>window.open('https://m.youtube.com/','_blank');setSplit(50);getGPS(()=>googleView(null,17));</script></body></html>
